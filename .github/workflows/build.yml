name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing secrets. GitHub exposes a missing secret as an empty string,
      # so they are kept under their own names and only applied when non-empty.
      #   KEY_ANDROID             password of the release keystore (alias key0)
      #   RELEASE_KEYSTORE_BASE64 optional: base64 of your own .jks; when set it
      #                           replaces the key.jks committed in the repo
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_ANDROID }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 platforms;android-33 build-tools;35.0.0

      # The repo does not ship a Gradle wrapper jar; AGP 8.11 needs Gradle >= 8.13.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # KEY_ANDROID is deliberately NOT exported here: build.gradle.kts would switch
      # the debug variant to the release keystore, and a wrong password would then
      # break the debug build too.
      - name: Build debug APK
        run: gradle --no-daemon --console=plain :aa-display:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aa-display-debug
          path: aa-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Install release keystore from secret
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > key.jks
          echo "key.jks replaced from RELEASE_KEYSTORE_BASE64 ($(stat -c %s key.jks) bytes)"

      - name: Verify release keystore password
        if: env.SIGNING_KEY_PASSWORD != ''
        run: |
          if keytool -list -keystore key.jks -storepass "$SIGNING_KEY_PASSWORD" -alias key0 > /dev/null 2>&1; then
            echo "keystore OK: alias key0 found"
          else
            echo "::error::KEY_ANDROID does not open key.jks (or alias key0 is missing). Set RELEASE_KEYSTORE_BASE64 to your own keystore or fix the password."
            exit 1
          fi

      - name: Build release APK
        if: env.SIGNING_KEY_PASSWORD != ''
        env:
          KEY_ANDROID: ${{ secrets.KEY_ANDROID }}
        run: gradle --no-daemon --console=plain :aa-display:assembleRelease

      - name: Upload release APK
        if: env.SIGNING_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: aa-display-release
          path: aa-display/build/outputs/apk/release/*.apk
          if-no-files-found: error
