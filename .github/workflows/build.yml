name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # key.jks password. GitHub exposes an unset secret as an empty string, so it is
      # kept under a separate name and only exported as KEY_ANDROID when non-empty;
      # build.gradle.kts switches to the release keystore whenever KEY_ANDROID exists.
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_ANDROID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 platforms;android-33 build-tools;35.0.0

      # The repo does not ship a Gradle wrapper jar; AGP 8.11 needs Gradle >= 8.13.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: |
          if [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "KEY_ANDROID secret present: building debug + release with key.jks"
            export KEY_ANDROID="$SIGNING_KEY_PASSWORD"
            gradle --no-daemon --console=plain :aa-display:assembleDebug :aa-display:assembleRelease
          else
            echo "KEY_ANDROID secret absent: building debug only (debug keystore)"
            gradle --no-daemon --console=plain :aa-display:assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aa-display-debug
          path: aa-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.SIGNING_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: aa-display-release
          path: aa-display/build/outputs/apk/release/*.apk
          if-no-files-found: error
